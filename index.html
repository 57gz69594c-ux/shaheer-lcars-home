<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, initial-scale=1, user-scalable=no">
<title>HOME CONTROL</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:240px; height:282px; background:#050506; overflow:hidden;
    font-family:"Courier New", Courier, monospace; }
  body { display:flex; flex-direction:column; position:relative; }

  :root{
    /* panel switch/LED colors: red / blue / white / purple accent */
    --orange:#ff2d2d; --purple:#a239ff; --blue:#3fa0ff;
    --gold:#f2f2f2; --rust:#8b0000; --teal:#efe6cf; --bg:#050506;
    --panel:#17181b; --panel2:#212327; --metal:#2b2e33; --border:#45484e;
    /* readout/menu text: amber primary, purple secondary, red = alert */
    --amber:#ffb400;
  }

  html,body{
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px),
      var(--bg);
  }

  /* asynchronous snap on/off, modeled on practical greeblie panels: simple
     flasher-driven bulbs that cut fully off (not fade) and stay dark a beat
     before snapping back on, each light running its own uneven cycle. */
  @keyframes flashSnapA{ 0%,28%{opacity:1;} 29%,71%{opacity:0;} 72%,100%{opacity:1;} }
  @keyframes flashSnapB{ 0%,38%{opacity:0;} 39%,58%{opacity:1;} 59%,100%{opacity:0;} }
  @keyframes flashSnapC{ 0%,12%{opacity:1;} 13%,55%{opacity:0;} 56%,100%{opacity:1;} }
  @keyframes alertFlash{ 0%,100%{ box-shadow:0 0 6px 1px var(--orange); } 50%{ box-shadow:0 0 1px 0 transparent; } }
  @keyframes firingPulse{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

  /* ---------- header / elbow ---------- */
  #header{ display:flex; align-items:stretch; height:30px; background:var(--panel);
    border-bottom:2px solid var(--metal); }
  #elbow{ width:26px; background:var(--metal); display:flex; align-items:center;
    justify-content:center; gap:3px; border-right:1px solid #000;
    background-image: radial-gradient(circle at 3px 3px, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 6px 6px; }
  #elbow .led{ width:4px; height:4px; border-radius:50%; }
  #elbow .led.r{ background:var(--orange); box-shadow:0 0 3px var(--orange); animation:flashSnapA 3.4s infinite; }
  #elbow .led.w{ background:var(--gold); box-shadow:0 0 3px var(--gold); animation:flashSnapB 4.1s infinite .5s; }
  #elbow .led.b{ background:var(--blue); box-shadow:0 0 3px var(--blue); animation:flashSnapC 3.8s infinite 1.1s; }
  #headerBar{ flex:1; background:var(--panel); display:flex; align-items:center;
    justify-content:space-between; padding:0 8px 0 8px; border-left:1px solid #000; }
  #title{ color:var(--amber); font-weight:700; font-size:11px; letter-spacing:2px;
    text-shadow:0 0 5px rgba(255,180,0,0.85); }
  #gearBtn{ background:#000; color:var(--orange); border:1px solid var(--orange); width:18px; height:18px;
    border-radius:50%; font-size:10px; line-height:16px; text-align:center; padding:0; }

  /* ---------- lights strip: red / blue / white, snap-blinking, async ---------- */
  #lightsStrip{ display:flex; align-items:center; justify-content:center; gap:6px;
    height:10px; background:#000; border-bottom:1px solid var(--metal); }
  #lightsStrip span{ width:5px; height:5px; border-radius:1px; }
  #lightsStrip span:nth-child(1){ background:var(--orange); box-shadow:0 0 3px var(--orange); animation:flashSnapA 3.1s infinite; }
  #lightsStrip span:nth-child(2){ background:var(--gold); box-shadow:0 0 3px var(--gold); animation:flashSnapB 3.9s infinite .6s; }
  #lightsStrip span:nth-child(3){ background:var(--blue); box-shadow:0 0 3px var(--blue); animation:flashSnapC 4.4s infinite 1.2s; }
  #lightsStrip span:nth-child(4){ background:var(--orange); box-shadow:0 0 3px var(--orange); animation:flashSnapB 3.6s infinite 1.8s; }
  #lightsStrip span:nth-child(5){ background:var(--gold); box-shadow:0 0 3px var(--gold); animation:flashSnapC 3.3s infinite .2s; }
  #lightsStrip span:nth-child(6){ background:var(--blue); box-shadow:0 0 3px var(--blue); animation:flashSnapA 4.2s infinite 2.1s; }
  #lightsStrip span:nth-child(7){ background:var(--orange); box-shadow:0 0 3px var(--orange); animation:flashSnapC 3.7s infinite .9s; }

  /* ---------- tabs: black readout with glowing text, no blue ---------- */
  #tabs{ display:flex; gap:3px; padding:5px 6px 0 6px; height:22px; }
  .tab{ flex:1; border:1px solid var(--border); border-radius:2px; font-weight:700; font-size:9px;
    letter-spacing:1.5px; color:#55585e; background:#000; }
  .tab.active{ color:#000; }
  .tab[data-tab="media"].active{ color:var(--amber); border-color:var(--amber);
    text-shadow:0 0 6px var(--amber); box-shadow:inset 0 0 8px rgba(255,180,0,.35); }
  .tab[data-tab="scenes"].active{ color:var(--purple); border-color:var(--purple);
    text-shadow:0 0 6px var(--purple); box-shadow:inset 0 0 8px rgba(162,57,255,.35); }

  /* ---------- content ---------- */
  #content{ flex:1; background:var(--panel); overflow-y:auto; padding:6px;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 14px); }
  .panel{ display:flex; flex-direction:column; gap:5px; }
  .btn{ border:1px solid rgba(0,0,0,0.5); border-radius:3px; height:32px; width:100%;
    display:flex; align-items:center; gap:8px; padding:0 12px; font-weight:700;
    font-size:10px; letter-spacing:1.5px; color:#050506; text-transform:uppercase;
    position:relative; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), inset 0 -2px 3px rgba(0,0,0,0.35); }
  .btn::before{ content:''; width:6px; height:6px; border-radius:50%; background:rgba(0,0,0,0.35);
    box-shadow:inset 0 0 2px rgba(0,0,0,0.6); flex:none; }
  .btn:active, .btn.firing{ filter:brightness(1.25); transform:scale(0.98); }
  .btn.firing::before{ background:#fff; box-shadow:0 0 6px #fff, 0 0 10px #fff; animation:firingPulse .5s infinite; }
  .btn.c-orange{ background:var(--orange); }
  .btn.c-purple{ background:var(--purple); }
  .btn.c-blue{ background:var(--blue); }
  .btn.c-gold{ background:var(--gold); }
  .btn.c-rust{ background:var(--rust); color:var(--gold); }
  .btn.c-teal{ background:var(--teal); }

  /* ---------- status bar: amber readout, purple = confirm, red = alert ---------- */
  #statusBar{ height:20px; background:#000; color:var(--amber); font-weight:700;
    font-size:10px; letter-spacing:1.5px; display:flex; align-items:center;
    justify-content:center; border-top:1px solid var(--metal);
    text-shadow:0 0 5px var(--amber); }
  #statusBar.ok{ color:var(--purple); text-shadow:0 0 6px var(--purple); }
  #statusBar.err{ color:#ff3333; text-shadow:0 0 6px #ff3333; animation:alertFlash .6s infinite; }

  /* ---------- build tag: tiny hull-stencil registry stamp ---------- */
  #buildTag{ position:absolute; right:5px; bottom:3px; font-size:7px; letter-spacing:1px;
    color:var(--amber); opacity:.45; text-shadow:0 0 3px rgba(255,180,0,.6);
    pointer-events:none; z-index:3; }

  /* ---------- settings overlay: black + glowing amber/purple/red text ---------- */
  #settings{ position:fixed; inset:0; background:#050506; z-index:10; display:flex;
    flex-direction:column; }
  #settingsHeader{ height:26px; background:#000; border-bottom:2px solid var(--purple);
    display:flex; align-items:center; justify-content:space-between; padding:0 8px; }
  #settingsHeader span{ color:var(--purple); font-weight:700; font-size:10px; letter-spacing:2px;
    text-shadow:0 0 6px var(--purple); }
  #closeBtn{ background:#000; color:var(--purple); border:1px solid var(--purple); width:16px; height:16px;
    border-radius:50%; font-size:10px; line-height:14px; }
  #settingsBody{ flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .field label{ display:block; color:var(--amber); font-size:9px; font-weight:700;
    letter-spacing:.5px; margin-bottom:2px; text-shadow:0 0 4px rgba(255,180,0,.6); }
  .field input{ width:100%; background:#000; border:1px solid var(--border); color:var(--amber);
    font-size:10px; padding:5px 6px; border-radius:2px; font-family:inherit; }
  .sectionLabel{ color:var(--orange); font-size:9px; font-weight:700; letter-spacing:1.5px;
    margin-top:4px; text-shadow:0 0 4px rgba(255,45,45,.6); }
  #saveBtn{ margin-top:4px; }
  .sceneRow{ border:1px solid var(--border); border-radius:2px; padding:6px; background:var(--panel2); }
  .sceneRow .rmBtn{ background:#1a0505; color:var(--orange); border:1px solid var(--orange); font-size:9px;
    font-weight:700; letter-spacing:.5px; padding:4px 8px; border-radius:2px; margin-top:2px; }

  ::-webkit-scrollbar{ width:0; }
</style>
</head>
<body>

<div id="header">
  <div id="elbow">
    <span class="led r"></span>
    <span class="led w"></span>
    <span class="led b"></span>
  </div>
  <div id="headerBar">
    <span id="title">HOME CONTROL</span>
    <button id="gearBtn">&#9881;</button>
  </div>
</div>

<div id="lightsStrip">
  <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<div id="tabs">
  <button class="tab active" data-tab="media">MEDIA</button>
  <button class="tab" data-tab="scenes">SCENES</button>
</div>

<div id="content">
  <div class="panel" id="panel-media"></div>
  <div class="panel" id="panel-scenes" style="display:none"></div>
</div>

<div id="statusBar">STANDBY</div>
<div id="buildTag">HC&middot;REV.05</div>

<div id="settings">
  <div id="settingsHeader">
    <span>SETTINGS</span>
    <button id="closeBtn">&times;</button>
  </div>
  <div id="settingsBody">
    <div class="field">
      <label>PUSHCUT API KEY</label>
      <input id="apiKeyInput" type="text" placeholder="paste key from Pushcut app">
    </div>
    <div id="nameFields"></div>
    <div class="sectionLabel">SCENES</div>
    <div id="sceneFields"></div>
    <button id="addSceneBtn" class="btn c-orange">+ ADD SCENE</button>
    <button id="saveBtn" class="btn c-teal">SAVE</button>
    <button id="restoreBtn" class="btn c-rust">RESTORE DEFAULTS</button>
  </div>
</div>

<script>
var MEDIA_ACTIONS = [
  { id:'play',    label:'Play',          shortcut:'R1 Play',            color:'c-blue' },
  { id:'pause',   label:'Pause',         shortcut:'R1 Pause',           color:'c-blue' },
  { id:'next',    label:'Next Track',    shortcut:'R1 Next Track',      color:'c-teal' },
  { id:'prev',    label:'Previous Track',shortcut:'R1 Previous Track',  color:'c-teal' },
  { id:'volup',   label:'Volume Up',     shortcut:'R1 Volume Up',       color:'c-gold' },
  { id:'voldown', label:'Volume Down',   shortcut:'R1 Volume Down',     color:'c-gold' }
];

/* Scenes are fully user-editable (add/remove/rename in Settings) since these
   are personal Home app scenes/rooms, not fixed like the media transport controls. */
var SCENE_DEFAULTS = [
  { id:'startrek',  label:'Star Trek', shortcut:'R1 Star Trek' },
  { id:'daytime',   label:'Daytime',   shortcut:'R1 Daytime' },
  { id:'cockpit',   label:'Cockpit',   shortcut:'R1 Cockpit' },
  { id:'spaceship', label:'Spaceship', shortcut:'R1 Spaceship' },
  { id:'tarot',     label:'Tarot',     shortcut:'R1 Tarot' }
];
var SCENE_COLORS = ['c-orange','c-purple','c-blue','c-gold','c-rust','c-teal'];

var STORE_KEY = 'lcarsHomeConfig';

function defaultConfig(){
  var names = {};
  MEDIA_ACTIONS.forEach(function(a){ names[a.id] = a.shortcut; });
  return { key:'', names:names, scenes: SCENE_DEFAULTS.map(function(s){ return Object.assign({}, s); }) };
}

function loadConfig(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultConfig();
    var parsed = JSON.parse(raw);
    var d = defaultConfig();
    return {
      key: parsed.key || '',
      names: Object.assign(d.names, parsed.names || {}),
      scenes: (parsed.scenes && parsed.scenes.length) ? parsed.scenes : d.scenes
    };
  }catch(e){ return defaultConfig(); }
}

function saveConfig(cfg){ localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); }

var config = loadConfig();

var statusBar = document.getElementById('statusBar');
var statusTimer = null;
function setStatus(text, cls){
  clearTimeout(statusTimer);
  statusBar.textContent = text;
  statusBar.className = cls || '';
}

function fireAction(label, shortcutName, btnEl){
  var cfg = loadConfig();
  if(!cfg.key){ openSettings(); return; }
  btnEl.classList.add('firing');
  setStatus('EXECUTING: ' + label.toUpperCase());
  fetch('https://api.pushcut.io/' + encodeURIComponent(cfg.key) +
        '/execute?shortcut=' + encodeURIComponent(shortcutName),
        { method:'POST', mode:'no-cors' })
    .then(function(){ setStatus('SENT: ' + label.toUpperCase(), 'ok'); })
    .catch(function(){ setStatus('LINK ERROR', 'err'); })
    .then(function(){
      statusTimer = setTimeout(function(){
        btnEl.classList.remove('firing');
        setStatus('STANDBY');
      }, 1400);
    });
}

function renderMediaPanel(){
  var cfg = loadConfig();
  var el = document.getElementById('panel-media');
  el.innerHTML = '';
  MEDIA_ACTIONS.forEach(function(a){
    var btn = document.createElement('button');
    btn.className = 'btn ' + a.color;
    btn.textContent = a.label;
    btn.addEventListener('click', function(){ fireAction(a.label, cfg.names[a.id], btn); });
    el.appendChild(btn);
  });
}

function renderScenePanel(){
  var cfg = loadConfig();
  var el = document.getElementById('panel-scenes');
  el.innerHTML = '';
  cfg.scenes.forEach(function(s, i){
    var btn = document.createElement('button');
    btn.className = 'btn ' + SCENE_COLORS[i % SCENE_COLORS.length];
    btn.textContent = s.label;
    btn.addEventListener('click', function(){ fireAction(s.label, s.shortcut, btn); });
    el.appendChild(btn);
  });
}

renderMediaPanel();
renderScenePanel();

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(function(tabBtn){
  tabBtn.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    tabBtn.classList.add('active');
    var which = tabBtn.getAttribute('data-tab');
    document.getElementById('panel-media').style.display = which === 'media' ? 'flex' : 'none';
    document.getElementById('panel-scenes').style.display = which === 'scenes' ? 'flex' : 'none';
  });
});

/* ---------- settings ---------- */
var settingsEl = document.getElementById('settings');
var apiKeyInput = document.getElementById('apiKeyInput');
var nameFieldsEl = document.getElementById('nameFields');
var sceneFieldsEl = document.getElementById('sceneFields');
var editingScenes = [];

function renderNameFields(cfg){
  nameFieldsEl.innerHTML = '';
  var h = document.createElement('div');
  h.className = 'sectionLabel';
  h.textContent = 'MEDIA SHORTCUT NAMES';
  nameFieldsEl.appendChild(h);
  MEDIA_ACTIONS.forEach(function(a){
    var wrap = document.createElement('div');
    wrap.className = 'field';
    var lab = document.createElement('label');
    lab.textContent = a.label;
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.dataset.id = a.id;
    inp.value = cfg.names[a.id];
    wrap.appendChild(lab);
    wrap.appendChild(inp);
    nameFieldsEl.appendChild(wrap);
  });
}

function renderSceneFields(){
  sceneFieldsEl.innerHTML = '';
  editingScenes.forEach(function(s, idx){
    var row = document.createElement('div');
    row.className = 'sceneRow';

    var labWrap = document.createElement('div'); labWrap.className = 'field';
    var labLab = document.createElement('label'); labLab.textContent = 'SCENE NAME (shown on button)';
    var labInp = document.createElement('input');
    labInp.type = 'text'; labInp.value = s.label;
    labInp.addEventListener('input', function(){ editingScenes[idx].label = labInp.value; });
    labWrap.appendChild(labLab); labWrap.appendChild(labInp);

    var shWrap = document.createElement('div'); shWrap.className = 'field';
    var shLab = document.createElement('label'); shLab.textContent = 'SHORTCUT NAME (in Pushcut)';
    var shInp = document.createElement('input');
    shInp.type = 'text'; shInp.value = s.shortcut;
    shInp.addEventListener('input', function(){ editingScenes[idx].shortcut = shInp.value; });
    shWrap.appendChild(shLab); shWrap.appendChild(shInp);

    var rmBtn = document.createElement('button');
    rmBtn.className = 'rmBtn'; rmBtn.textContent = 'REMOVE';
    rmBtn.addEventListener('click', function(){ editingScenes.splice(idx, 1); renderSceneFields(); });

    row.appendChild(labWrap);
    row.appendChild(shWrap);
    row.appendChild(rmBtn);
    sceneFieldsEl.appendChild(row);
  });
}

function openSettings(){
  var cfg = loadConfig();
  apiKeyInput.value = cfg.key;
  renderNameFields(cfg);
  editingScenes = cfg.scenes.map(function(s){ return Object.assign({}, s); });
  renderSceneFields();
  settingsEl.style.display = 'flex';
}
function closeSettings(){ settingsEl.style.display = 'none'; }

document.getElementById('gearBtn').addEventListener('click', openSettings);
document.getElementById('closeBtn').addEventListener('click', closeSettings);

document.getElementById('addSceneBtn').addEventListener('click', function(){
  editingScenes.push({ label:'', shortcut:'' });
  renderSceneFields();
});

document.getElementById('saveBtn').addEventListener('click', function(){
  var cfg = loadConfig();
  cfg.key = apiKeyInput.value.trim();
  nameFieldsEl.querySelectorAll('input[data-id]').forEach(function(inp){
    cfg.names[inp.dataset.id] = inp.value.trim();
  });
  cfg.scenes = editingScenes
    .map(function(s){ return { label: s.label.trim(), shortcut: s.shortcut.trim() }; })
    .filter(function(s){ return s.label && s.shortcut; })
    .map(function(s, i){
      return Object.assign({ id: 'scene' + i + '-' + s.label.toLowerCase().replace(/[^a-z0-9]+/g, '') }, s);
    });
  saveConfig(cfg);
  renderMediaPanel();
  renderScenePanel();
  setStatus('SETTINGS SAVED', 'ok');
  closeSettings();
});

document.getElementById('restoreBtn').addEventListener('click', function(){
  var cfg = defaultConfig();
  cfg.key = apiKeyInput.value.trim();
  saveConfig(cfg);
  renderNameFields(cfg);
  editingScenes = cfg.scenes.map(function(s){ return Object.assign({}, s); });
  renderSceneFields();
  renderMediaPanel();
  renderScenePanel();
});

/* first run: no key saved yet -> open settings automatically */
if(!config.key){ openSettings(); }
</script>
</body>
</html>
